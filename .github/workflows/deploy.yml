name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # Assets are served with max-age=600 and their filenames never change, so
      # without this a returning visitor spends ten minutes with the new HTML and
      # the old stylesheet. Stamping the URL with the file's own hash makes the
      # pair atomic. Done here as well as locally so it cannot be forgotten.
      - name: Stamp asset URLs with their content hash
        run: node scripts/stamp-assets.mjs

      # The page scaffold (templates/), the build scripts and the README are
      # for whoever edits this repo, not for visitors: a published template
      # full of {{APP_NAME}} placeholders reads like a real, broken page.
      # Removed from this throwaway checkout only, after stamping used them.
      # <!-- AUTHOR: ... --> notes are instructions to whoever edits a page
      # (what to keep in sync, what was deliberately left out). They are not
      # for visitors, and in page source they read like leftovers.
      - name: Strip authoring notes from the published HTML
        run: |
          node -e '
            const fs = require("fs"), path = require("path");
            const walk = d => fs.readdirSync(d, { withFileTypes: true }).flatMap(e => {
              const p = path.join(d, e.name);
              if (e.isDirectory()) return [".git", "node_modules", "templates"].includes(e.name) ? [] : walk(p);
              return p.endsWith(".html") ? [p] : [];
            });
            let n = 0;
            for (const f of walk(".")) {
              const src = fs.readFileSync(f, "utf8");
              const out = src.replace(/[ \t]*<!--\s*AUTHOR[\s\S]*?-->[ \t]*\n?/g, () => (n++, ""));
              if (out !== src) fs.writeFileSync(f, out);
            }
            console.log(`stripped ${n} authoring notes`);
          '

      - name: Keep authoring files off the site
        run: rm -rf templates scripts README.md

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
